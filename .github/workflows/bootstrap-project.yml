name: Bootstrap project

on:
  push:
    paths:
      - '.github/workflows/bootstrap-project.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Reconstruct and validate project
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/s*.b64 | base64 --decode > /tmp/tihulu-brave-tv.tar.gz
          echo '6ba3440c72f15826246dfbf3d3b34aa802a47c6303b60abd2e59ea2c35d9838d  /tmp/tihulu-brave-tv.tar.gz' | sha256sum --check --strict -
          tar -xzf /tmp/tihulu-brave-tv.tar.gz -C .

          mkdir -p LICENSES
          curl -fsSL https://raw.githubusercontent.com/spdx/license-list-data/main/text/AGPL-3.0-only.txt -o LICENSE
          curl -fsSL https://raw.githubusercontent.com/spdx/license-list-data/main/text/MPL-2.0.txt -o LICENSES/MPL-2.0.txt

          chmod +x scripts/*.sh
          ./scripts/check.sh

      - name: Publish validated project tree
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .bootstrap
          rm -f .github/workflows/bootstrap-project.yml

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A

          if git diff --cached --quiet; then
            echo 'No changes to publish.'
            exit 0
          fi

          git commit -m 'Add initial Google TV browser overlay'
          git push origin HEAD:main
