name: Tihulu Tube TV smoke test
on:
  push:
    branches: [codex/tihulu-tube]
    paths: [.github/workflows/test-tihulu-tube.yml, .github/scripts/tube-smoke.py]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  tv:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
      - name: Wait for native APK build and download emulator APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_id=$(gh api 'repos/Tihulu/tihulu-brave-tv/actions/runs?branch=codex%2Ftihulu-tube&per_page=30' --jq '[.workflow_runs[] | select(.name == "Build Tihulu Tube")][0].id')
          test "$run_id" != null
          gh run watch "$run_id" --exit-status --interval 30
          mkdir -p emulator-apk
          gh run download "$run_id" --name TihuluTube-emulator --dir emulator-apk
          echo "APK_BUILD_RUN=$run_id" >> "$GITHUB_ENV"
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test on 2 GB Android TV emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: android-tv
          arch: x86
          profile: tv_1080p
          ram-size: 2048M
          heap-size: 128M
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: python3 .github/scripts/tube-smoke.py
      - name: Save screenshots and diagnostic evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: TihuluTube-TV-smoke-${{ github.run_number }}
          path: smoke-results/
          retention-days: 14
          if-no-files-found: warn
