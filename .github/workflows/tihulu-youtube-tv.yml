name: Build Tihulu YouTube TV APKs
on:
  push:
    branches: [ tihulu-youtube-tv ]
    paths:
      - "youtube-tv/**"
      - ".github/workflows/tihulu-youtube-tv.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: youtube-tv
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build ARM32 and ARM64 release APKs
        run: gradle :app:assembleArm32Release :app:assembleArm64Release --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: tihulu-youtube-tv-apks
          path: |
            youtube-tv/app/build/outputs/apk/arm32/release/*.apk
            youtube-tv/app/build/outputs/apk/arm64/release/*.apk
